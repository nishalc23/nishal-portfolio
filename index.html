{id:'ironman',name:'Ironman Intel',category:'Full stack · Personal project',tech:'React / FastAPI / PostgreSQL / Redis / Claude',intro:'Training became a software problem.',copy:'I wanted my activities, strength sessions, and daily plan in one place. So I built a platform that syncs Garmin data and uses actual training history to generate a plan with Claude.',url:'https://nishalc23.github.io/ironman-intel/',link:'Open live project',notes:'The backend computes fitness, fatigue, and form using exponential moving averages of daily training load. Claude receives the load history and gym logs to produce a personalized daily plan. Training-stress calculations reject invalid durations and non-finite sensor values. Docker Compose runs the database, cache, API, and ingestion services.'},
