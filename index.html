<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060b17"><title>Nishal Chintalapati — Neon Arcade</title><meta name="description" content="Explore three interactive red 3D claw machines on a cherry blossom street."><style>
:root{color-scheme:dark;--line:#ffffff25}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b18;color:#f2f5fc;font:14px/1.6 Arial,Helvetica,sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:2px solid #86eaff;outline-offset:4px}#webgl{position:fixed;inset:0;background:#070b18}#webgl canvas{display:block;width:100%;height:100%;touch-action:none}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#080d1b;color:#a6c7dd;font:11px 'Courier New',monospace;letter-spacing:2px}#loading[hidden]{display:none}#back{position:fixed;top:22px;left:23px;z-index:5;background:#091323c9;backdrop-filter:blur(12px);border:1px solid #b6d9f24d;border-radius:28px;color:#d3e6f4;padding:9px 15px;font-size:11px}#back[hidden]{display:none}.mobile-tabs{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;gap:4px;padding:5px;border:1px solid #a1cfe54d;border-radius:28px;background:#07111ed4;backdrop-filter:blur(16px);z-index:5}.mobile-tabs button{border:0;background:transparent;padding:8px 13px;border-radius:24px;font-size:10px;white-space:nowrap;color:#becfe3}.mobile-tabs button[aria-pressed=true]{background:#9ee4ff21;color:#eafcff}.sr-only,#accessible{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#accessible:focus-within,#accessible.fallback{top:20px;left:50%;transform:translateX(-50%);width:auto;height:auto;clip-path:none;overflow:visible;background:#0b1528;padding:12px;z-index:20;display:flex;gap:12px}#accessible button{background:none;border:1px solid #a7cadd;padding:8px 14px}
dialog{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:none;width:min(760px,100vw);max-width:100vw;border:0;border-left:1px solid #c1d8f044;padding:0;color:#f1f4fa;background:linear-gradient(140deg,#142331f7,#0a111cfc 65%);box-shadow:-20px 0 80px #020713bb;overflow:auto}dialog::backdrop{background:#02071199;backdrop-filter:blur(9px)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:24px 36px;position:sticky;top:0;z-index:2;background:#0c1723ed;backdrop-filter:blur(20px);border-bottom:1px solid var(--line);font:10px 'Courier New',monospace;letter-spacing:1.2px;color:#afc4d8}.close{background:transparent;border:1px solid #b3ccdf55;border-radius:50%;width:34px;height:34px;font-size:23px;line-height:1}.close:hover{background:#ffffff12}.panel-body{padding:42px 40px 55px}.eyebrow{font:9px 'Courier New',monospace;letter-spacing:2px;color:#8de6f2;margin:0 0 17px}.panel-body h1{font-size:clamp(30px,3.5vw,43px);font-weight:500;letter-spacing:-1.6px;line-height:1.2;margin:0 0 24px}.panel-body h2{font-size:19px;font-weight:500;margin:0 0 10px}.panel-body p{color:#b4c0d1;line-height:1.85;margin:0 0 24px;max-width:61ch}.panel-body p strong{color:#f2f8fc;font-weight:400}.tech{font:10px/2 'Courier New',monospace;color:#b3d5e9;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:25px 0}.link-button{display:inline-block;border:1px solid #a8cbdf55;background:#a8d6f509;border-radius:4px;padding:11px 18px;text-decoration:none;font-size:12px;color:#dceaf8;margin:0 9px 12px 0}.link-button:hover{border-color:#9dedff;background:#8adaf512}.back{background:none;padding:0;color:#90e4f1;font:10px 'Courier New',monospace;margin-bottom:30px}.note{border-left:1px solid #84dcec66;background:#ffffff04;padding:15px 19px;font-size:12px;line-height:1.9;color:#bad1e2;margin-top:20px}.job{padding:25px 0;border-bottom:1px solid var(--line)}.job-top{display:flex;justify-content:space-between;gap:15px}.job-top span{font:9px 'Courier New',monospace;color:#97b6cc;padding-top:6px}.job-role{font-size:11px;color:#8fa7bd;margin-bottom:14px}.job p{margin-bottom:0}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.about-fact{border-top:1px solid var(--line);padding:17px 0}.about-fact small{display:block;font:9px 'Courier New',monospace;letter-spacing:1px;color:#8de6f2;margin-bottom:9px}.about-fact strong{font-size:12px;font-weight:400}.contact-address{font:11px 'Courier New',monospace;overflow-wrap:anywhere;margin-top:20px!important}.selection{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:25px}.project-card{padding:22px;background:#ffffff04;border:1px solid #bdd5e633;border-radius:7px;text-align:left;position:relative}.project-card:hover{border-color:#8de6f2}.project-card .orb{width:55px;height:55px;display:flex;margin:0 auto 23px}.project-card small{display:block;font:8px/1.7 'Courier New',monospace;color:#92b1c7;letter-spacing:1px;margin-bottom:8px}.project-card strong{font-weight:500;font-size:15px}.project-card .arrow{position:absolute;right:15px;bottom:15px;color:#9acde4}.project-card .orb b{font-size:18px}@media(max-width:700px){.mobile-tabs{display:flex}#back{top:13px;left:13px}.panel-body{padding:30px 24px 45px}.panel-header{padding:20px 24px}.panel-body h1{font-size:32px}.job-top{display:block}.job-top span{display:block;margin:5px 0 10px}.about-grid{grid-template-columns:1fr}.selection{gap:9px}.project-card{padding:17px 12px}.project-card strong{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style></head><body><main id="webgl" aria-label="Interactive 3D claw machines"></main><div id="loading" role="status">LOADING THE ARCADE</div><button id="back" hidden>← Back</button><nav class="mobile-tabs" aria-label="Choose a machine"><button data-machine="about" aria-pressed="true">About Me</button><button data-machine="experience" aria-pressed="false">Experience</button><button data-machine="projects" aria-pressed="false">Projects</button></nav><nav id="accessible" aria-label="Portfolio navigation"><button data-open="about">About Me</button><button data-open="experience">Experience</button><button data-open="projects">Projects</button></nav><div class="sr-only" id="status" role="status" aria-live="polite"></div><dialog id="panel" aria-labelledby="panel-title"><div class="panel-header"><span id="panel-title">PROJECTS</span><button class="close" aria-label="Close details">×</button></div><div class="panel-body" id="panel-body"></div></dialog><script>
const projects=[
{id:'ironman',name:'Ironman Intel',category:'Full stack · Personal project',tech:'React / FastAPI / PostgreSQL / Redis / Claude',intro:'Training became a software problem.',copy:'I wanted my activities, strength sessions, and daily plan in one place. So I built a platform that syncs Garmin data and uses actual training history to generate a plan with Claude.',url:'https://nishalc23.github.io/ironman-intel/',link:'Open live project',notes:'The backend computes fitness, fatigue, and form using exponential moving averages of daily training load. Claude receives the load history and gym logs to produce a personalized daily plan. Training-stress calculations reject invalid durations and non-finite sensor values. Docker Compose runs the database, cache, API, and ingestion services.'},
{id:'compass',name:'Compass',category:'Backend engineering · AI meeting intelligence',tech:'TypeScript / Express / PostgreSQL / Redis / Whisper / Claude',intro:'Turn a meeting recording into something you can act on.',copy:'An audio-processing pipeline that transcribes recordings with Whisper, then uses Claude to extract summaries, action items, and decisions into a structured database.',notes:'The upload API responds with a meeting and job ID while a separate worker handles transcription and extraction through a Redis queue. PostgreSQL stores meetings, action items, decisions, and processing state. Extraction output is validated before database writes. Results and completion state are saved in one transaction, with rollback on failure and a guard against replaying completed results. Authentication uses JWT and bcrypt.'},
{id:'fraud',name:'Fraud Lab',category:'Machine learning · Risk & review',tech:'Python / scikit-learn / Calibration / Chronological evaluation',intro:'How much fraud can a team flag when it can only review a small fraction of transactions?',copy:'A reproducible experiment comparing logistic regression and gradient boosting on 60,000 simulated transactions, with an interactive review-policy demo.',url:'https://github.com/nishalc23/fraud-lab',link:'View repository',notes:'Training, calibration, validation, and test data occupy separate chronological partitions. The model and cutoff are chosen on validation before final test evaluation. Policy tests cover zero and full review capacity, invalid scores, chronological boundaries, and confusion-matrix totals. Results describe simulated transactions, not customer data or real-world fraud prevention.'},
{id:'attention',name:'Attention Is All You Need',category:'ML fundamentals · NumPy implementation',tech:'NumPy / Matrix math / Backpropagation',intro:'I wanted to understand attention all the way through the backward pass.',copy:'A transformer built in NumPy with multi-head attention, causal masking, and manual backpropagation through every trainable layer.',url:'https://github.com/nishalc23/attention-is-all-you-need',link:'View repository',notes:'Full backpropagation through embeddings, attention, feed-forward layers, layer normalization, and output projection. Finite-difference tests check every parameter in a small model, and causal-mask tests verify that future tokens cannot influence earlier predictions. The repeated-text training demo reduces loss from 2.225 to 0.384 over 15 epochs; this is a toy training task.'}
];
const jobs=[['Visa','Software Engineering Intern','Austin, TX','JUN — SEP 2026','Built and shipped the IntelliLink testing agent. Automated 53 regression scenarios across seven application areas and fixed 11 bugs involving context truncation, race conditions, and DOM behavior.'],['Conmitto','Software Engineering Intern','Santa Monica, CA','SEP 2025 — JAN 2026','Built scheduling, driver check-in, and organization services with ASP.NET Core and JavaScript. Reworked booking flows to eliminate 90% of interface JavaScript errors and reduced deployment times by 60%.'],['Tech4Good GenAI Lab','AI Research Intern','Remote / UCSC','JUN 2025 — PRESENT','Build prompt workflows and RAG systems with vector embeddings and semantic search to analyze student learning data. Prototype and evaluate research tools using OpenAI, Anthropic, and Google Gemini APIs, with a focus on thematic analysis and barriers to AI adoption.'],['SanQuest','Software Engineering Intern','Irving, TX','JUN — SEP 2025','Built a talent-matching system using BERT, RoBERTa, and XGBoost, alongside a PDF ingestion pipeline for an HR analytics dashboard.'],['Code Ninjas','Coding Sensei','San Ramon, CA','JUN 2023 — JAN 2026','Taught programming to more than 100 students through hands-on projects, game development, and algorithm lessons.']];
const panel=document.querySelector('#panel'), body=document.querySelector('#panel-body');
let lastTrigger=null, dispensing=false;
const icons=['I','C','F','A'], colors=['','blue','purple','green'];
function can(i){return `<span class="orb ${colors[i]}" aria-hidden="true"><b>${icons[i]}</b></span>`}
function openPanel(type,trigger){if(dispensing)return;if(trigger)lastTrigger=trigger;const title=document.querySelector('#panel-title');
if(type==='projects'){title.textContent='PROJECTS';body.innerHTML=`<p class="eyebrow">SELECTED WORK / 2026</p><h1>A few things I've built.</h1><p class="intro">Tools for training, meeting intelligence, and learning how machine learning works. Choose a project to see the work behind it.</p><div class="selection">${projects.map((p,i)=>`<button class="project-card" data-project="${i}" aria-label="Open ${p.name}">${can(i)}<span><small>${['FULL STACK / ENDURANCE','BACKEND / AUDIO','MACHINE LEARNING','NUMPY / FROM SCRATCH'][i]}</small><strong>${p.name}</strong></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('')}</div>`}
else if(type==='experience'){title.textContent='EXPERIENCE';body.innerHTML=`<p class="eyebrow">WORK EXPERIENCE</p><h1>A few stops along the way.</h1>${jobs.map(j=>`<article class="job"><div class="job-top"><h2>${j[0]}</h2><span>${j[3]}</span></div><div class="job-role">${j[1]} · ${j[2]}</div><p>${j[4]}</p>${j[0]==='Visa'?'<div class="note">TypeScript · Claude Agent SDK · Playwright · MCP<br>Designed a generate-once, replay-without-LLM pipeline and a repair loop that learns from DOM snapshots and network diagnostics.</div>':''}</article>`).join('')}`}
else if(type==='about'){title.textContent='ABOUT ME';body.innerHTML=`<p class="eyebrow">NICE TO MEET YOU.</p><h1>I'm Nishal.</h1><p>I'm a UCLA student from San Ramon, California. I like building software I can actually use, understanding how things work, and going a little too far with a side project.</p><p>This past summer at Visa, I built a testing agent that turns plain-English workflows into Playwright tests. Outside of work, I've been building tools for training, meeting recordings, and learning machine learning from the ground up.</p><div class="about-grid"><div class="about-fact"><small>STUDYING</small><strong>Statistics &amp; Data Science · UCLA</strong></div><div class="about-fact"><small>OFF THE KEYBOARD</small><strong>Swimming. Cycling. Running.</strong></div></div><p>I'm training for a 70.3 Ironman. Ironman Intel started because I wanted my training data and daily plan in one place.</p><button class="link-button" data-open="contact">Let's talk ↗</button><a class="link-button" href="https://github.com/nishalc23" target="_blank" rel="noopener noreferrer">GitHub ↗</a>`}
else{title.textContent='SAY HELLO / NO COINS REQUIRED';body.innerHTML=`<p class="eyebrow">GET IN TOUCH</p><h1>Let's make something.</h1><p>Have an interesting project, a question about my work, or a good running route? I'd like to hear about it.</p><a class="link-button" href="mailto:nishalchintalapati@gmail.com">Email me ↗</a><a class="link-button" href="https://www.linkedin.com/in/nishal-chintalapati-83455528a" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a><a class="link-button" href="https://github.com/nishalc23" target="_blank" rel="noopener noreferrer">GitHub ↗</a><p class="contact-address">nishalchintalapati@gmail.com</p>`}
if(!panel.open)panel.showModal();panel.scrollTop=0;}
function showProject(i){const p=projects[i];document.querySelector('#panel-title').textContent='PROJECT / '+p.name.toUpperCase();body.innerHTML=`<button class="back" data-open="projects">← BACK TO PROJECTS</button><p class="eyebrow">${p.category.toUpperCase()}</p><h1>${p.name}</h1><p><strong>${p.intro}</strong></p><div class="tech">${p.tech}</div><p>${p.copy}</p>${p.url?`<a class="link-button" href="${p.url}" target="_blank" rel="noopener noreferrer">${p.link} ↗</a>`:'<p class="eyebrow">PRIVATE SOURCE · ASK ME ABOUT THE ARCHITECTURE</p>'}<h2 style="margin-top:24px">Under the hood</h2><p>${p.notes}</p>`;panel.scrollTop=0;body.querySelector('.back').focus();}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){openPanel(open.dataset.open,open);return}const card=e.target.closest('[data-project]');if(card&&!dispensing){dispensing=true;card.classList.add('dispensing');card.setAttribute('aria-busy','true');window.setTimeout(()=>{dispensing=false;if(panel.open)showProject(Number(card.dataset.project))},matchMedia('(prefers-reduced-motion:reduce)').matches?0:550)}});
document.querySelector('.close').addEventListener('click',()=>panel.close());panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)panel.close()}});panel.addEventListener('close',()=>{dispensing=false;if(lastTrigger?.isConnected)lastTrigger.focus()});


window.arcadeData={projects,jobs};window.openArcadeDetail=function(item){const trigger=document.querySelector("#webgl canvas");
if(item.project!==undefined){openPanel('projects',trigger);showProject(item.project)}else if(item.job!==undefined){openPanel('experience',trigger);const j=jobs[item.job];document.querySelector('#panel-title').textContent='EXPERIENCE / '+j[0].toUpperCase();body.innerHTML=`<p class="eyebrow">${j[3]} / ${j[2]}</p><h1>${j[0]}</h1><div class="tech">${j[1]}</div><p>${j[4]}</p>${item.job===0?'<h2>Agent-driven testing at Visa</h2><p>I built a TypeScript framework that turns plain-English workflows into Playwright tests. Claude explores the live application through MCP, generates a reusable spec, and repairs failures using DOM snapshots and API diagnostics.</p><div class="note">53 authored regression scenarios across seven application areas. Generated tests replay without further LLM calls. A shared knowledge base preserves verified selectors and lessons from failed runs.</div>':''}<button class="link-button" data-open="experience">All experience ↗</button>`;panel.scrollTop=0}
else if(item.action==='education'){openPanel('about',trigger);document.querySelector('#panel-title').textContent='ABOUT / EDUCATION';body.innerHTML='<p class="eyebrow">EDUCATION</p><h1>University of California,<br>Los Angeles.</h1><div class="tech">Statistics &amp; Data Science · Expected June 2028</div><p>I build software across backend systems, full-stack applications, and applied AI. My projects are where I put what I learn into practice.</p><button class="link-button" data-open="projects">Explore my work ↗</button>'}
else if(item.action==='offclock'){openPanel('about',trigger);document.querySelector('#panel-title').textContent='ABOUT / OFF THE CLOCK';body.innerHTML='<p class="eyebrow">OFF THE CLOCK</p><h1>Swim. Bike. Run.<br>Build. Repeat.</h1><p>I’m training for a 70.3 Ironman. Most weeks, I’m fitting swimming, cycling, and running around classes and coding.</p><p>Ironman Intel came from wanting my activities, strength sessions, and daily training plan in one place. It’s a project I use myself.</p><a class="link-button" href="https://nishalc23.github.io/ironman-intel/" target="_blank" rel="noopener noreferrer">Ironman Intel ↗</a>'}
else openPanel(item.action,trigger)}

</script><script type="module" src="assets/scene.js"></script></body></html>
