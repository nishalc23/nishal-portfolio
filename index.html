const projects=[
{id:'ironman',name:'Ironman Intel',category:'Full stack · Personal project',tech:'React / FastAPI / PostgreSQL / Redis / Claude',intro:'Training became a software problem.',copy:'I wanted my activities, strength sessions, and daily plan in one place. So I built a platform that syncs Garmin data and uses actual training history to generate a plan with Claude.',url:'https://nishalc23.github.io/ironman-intel/',link:'Open live project',notes:'The backend computes fitness, fatigue, and form using exponential moving averages of daily training load. Claude receives the load history and gym logs to produce a personalized daily plan. Training-stress calculations reject invalid durations and non-finite sensor values. Docker Compose runs the database, cache, API, and ingestion services.'},
{id:'compass',name:'Compass',category:'Backend engineering · AI meeting intelligence',tech:'TypeScript / Express / PostgreSQL / Redis / Whisper / Claude',intro:'Turn a meeting recording into something you can act on.',copy:'An audio-processing pipeline that transcribes recordings with Whisper, then uses Claude to extract summaries, action items, and decisions into a structured database.',notes:'The upload API responds with a meeting and job ID while a separate worker handles transcription and extraction through a Redis queue. PostgreSQL stores meetings, action items, decisions, and processing state. Extraction output is validated before database writes. Results and completion state are saved in one transaction, with rollback on failure and a guard against replaying completed results. Authentication uses JWT and bcrypt.'},
{id:'fraud',name:'Fraud Lab',category:'Machine learning · Risk & review',tech:'Python / scikit-learn / Calibration / Chronological evaluation',intro:'How much fraud can a team flag when it can only review a small fraction of transactions?',copy:'A reproducible experiment comparing logistic regression and gradient boosting on 60,000 simulated transactions, with an interactive review-policy demo.',url:'https://github.com/nishalc23/fraud-lab',link:'View repository',notes:'Training, calibration, validation, and test data occupy separate chronological partitions. The model and cutoff are chosen on validation before final test evaluation. Policy tests cover zero and full review capacity, invalid scores, chronological boundaries, and confusion-matrix totals. Results describe simulated transactions, not customer data or real-world fraud prevention.'},
{id:'attention',name:'Attention Is All You Need',category:'ML fundamentals · NumPy implementation',tech:'NumPy / Matrix math / Backpropagation',intro:'I wanted to understand attention all the way through the backward pass.',copy:'A transformer built in NumPy with multi-head attention, causal masking, and manual backpropagation through every trainable layer.',url:'https://github.com/nishalc23/attention-is-all-you-need',link:'View repository',notes:'Full backpropagation through embeddings, attention, feed-forward layers, layer normalization, and output projection. Finite-difference tests check every parameter in a small model, and causal-mask tests verify that future tokens cannot influence earlier predictions. The repeated-text training demo reduces loss from 2.225 to 0.384 over 15 epochs; this is a toy training task.'}

const jobs=[['Visa','Software Engineering Intern','Austin, TX','JUN — SEP 2026','Built and shipped the IntelliLink testing agent. Delivered 53 regression scenarios with a 100% pass rate and fixed 11 bugs involving context truncation, race conditions, and DOM behavior.'],['Conmitto','Software Engineering Intern','Santa Monica, CA','SEP 2025 — JAN 2026','Built scheduling, driver check-in, and organization services with ASP.NET Core and JavaScript. Reworked booking flows to eliminate 90% of interface JavaScript errors and reduced deployment times by 60%.'],['Tech4Good GenAI Lab','AI Research Intern','Remote / UCSC','JUN 2025 — PRESENT','Build prompt workflows and RAG systems with vector embeddings and semantic search to analyze student learning data. Prototype and evaluate research tools using OpenAI, Anthropic, and Google Gemini APIs, with a focus on thematic analysis and barriers to AI adoption.'],['SanQuest','Software Engineering Intern','Irving, TX','JUN — SEP 2025','Built a talent-matching system using BERT, RoBERTa, and XGBoost, alongside a PDF ingestion pipeline for an HR analytics dashboard.'],['Code Ninjas','Coding Sensei','San Ramon, CA','JUN 2023 — JAN 2026','Taught programming to more than 100 students through hands-on projects, game development, and algorithm lessons.']];

const views={
home:{title:"Nishal's Computer",status:'4 folders · 1 curious engineer',html:()=>`<div class="welcome"><div class="eyebrow">WELCOME TO MY CORNER OF THE INTERNET</div><h1>Nishal<br><em>Chintalapati.</em></h1><p class="intro-copy">Software engineer. UCLA student.<br>Building things, figuring things out, and training for a 70.3 Ironman.</p><div class="folder-grid">${gridItem('about','About me','The person')}${gridItem('experience','Experience','The journey')}${gridItem('projects','Projects','The work')}${gridItem('contact','Contact','Say hello')}</div><div class="welcome-bottom"><span>SELECT A FOLDER TO TAKE A LOOK AROUND</span><span>© 2026 NC</span></div></div>`},
about:{title:'About me.txt — Text Editor',status:'Personal notes',html:()=>`<article class="document"><div class="tag">FILE / ABOUT ME.TXT</div><h1>A little about me.</h1><p>I’m Nishal, a Computer Science student at UCLA from San Ramon, California. I expect to graduate in June 2028.</p><p>In my free time, I’m building projects and training for a 70.3 Ironman on December 6, 2026. Most weeks, I’m fitting swimming, cycling, and running around classes and coding.</p><p>This past summer at Visa, I built an agent for IntelliLink that turns plain-English workflows into UI tests using Claude and Playwright. I reduced test generation costs and built a pipeline to repair failed tests, shipping 53 regression scenarios across seven functional areas. Previously, I worked on scheduling and driver check-in services at Conmitto and resume processing and talent matching at SanQuest.</p><p>I also taught programming to more than 100 students at Code Ninjas in San Ramon. We worked on games and hands-on projects, and teaching helped me get better at explaining how code works.</p><button class="file-item" data-open="education">${folderIcon}<span>Education</span></button></article>`},
education:{title:'Education.txt — Text Editor',status:'University of California, Los Angeles',html:()=>`<article class="document"><div class="tag">EDUCATION / UCLA</div><h1>University of California,<br>Los Angeles.</h1><p><strong>B.S. in Data Science</strong><br>Expected graduation June 2028 · GPA 3.94</p><div class="meta">SAN RAMON, CALIFORNIA → LOS ANGELES</div><h2>Concentrations</h2><p>Computer Science<br>Software Engineering<br>Machine Learning</p></article>`},
experience:{title:'Experience — Work history',status:'5 experiences',html:()=>`<article class="document"><div class="tag">EXPERIENCE / WORK HISTORY</div><h1>Places I’ve built things.</h1>${jobs.map(j=>`<section class="job"><h2>${j[0]}</h2><small>${j[2]} · ${j[3]}</small><h3>${j[1]}</h3><p>${j[4]}</p></section>`).join('')}</article>`},

function focusWindow(id){const w=openWindows.get(id);if(!w)return;w.hidden=false;w.style.zIndex=++topZ;activeId=id;openWindows.forEach((el,key)=>el.classList.toggle('active',key===id));renderTasks()}
function renderTasks(){$('#tasks').innerHTML=[...openWindows].map(([id,w])=>`<button data-task="${id}" class="${activeId===id&&!w.hidden?'active':''}" title="${views[id].title}">${views[id].title.split(' — ')[0]}</button>`).join('')}
function openWindow(id){if(!views[id])return;if(openWindows.has(id)){focusWindow(id);return}const view=views[id],w=document.createElement('section');w.className='window';w.setAttribute('role','region');w.setAttribute('aria-label',view.title);w.dataset.window=id;const offset=Math.min(openWindows.size,4)*16;if(innerWidth>700){w.style.left=(145+offset)+'px';w.style.top=(25+offset)+'px'}w.innerHTML=`<div class="titlebar"><strong>${view.title}</strong><div class="lines"></div><div class="window-controls"><button data-action="minimize" aria-label="Minimize ${view.title}">−</button><button data-action="maximize" aria-label="Maximize ${view.title}">□</button><button data-action="close" aria-label="Close ${view.title}">×</button></div></div><div class="window-menu"><span>${id==='terminal'?'Shell':'File'}</span><span>View</span><span>${id==='home'?'Welcome':id==='projects'?'C:\\NISHAL\\PROJECTS':'Read only'}</span></div><div class="window-body">${view.html()}</div><div class="statusbar"><span>${view.status}</span><span>NISHAL OS</span></div>`;$('#windows').append(w);openWindows.set(id,w);focusWindow(id);w.addEventListener('pointerdown',()=>focusWindow(id));const bar=w.querySelector('.titlebar');bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;const r=w.getBoundingClientRect(),d=$('#desktop').getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;bar.setPointerCapture(e.pointerId);const move=ev=>{w.style.left=Math.max(0,Math.min($('#desktop').offsetWidth-w.offsetWidth,(ev.clientX-d.left-dx)/ (d.width/$('#desktop').offsetWidth)))+'px';w.style.top=Math.max(0,Math.min($('#desktop').offsetHeight-40,(ev.clientY-d.top-dy)/(d.height/$('#desktop').offsetHeight)))+'px'};const end=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',end);bar.removeEventListener('pointercancel',end)};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end)});if(id==='terminal'){w.querySelector('form').addEventListener('submit',terminalCommand);w.querySelector('input').focus()}}
function closeWindow(id){const w=openWindows.get(id);if(!w)return;w.remove();openWindows.delete(id);activeId=null;const ids=[...openWindows.keys()];if(ids.length)focusWindow(ids.at(-1));else renderTasks()}
function terminalCommand(e){e.preventDefault();const input=e.target.querySelector('input'),cmd=input.value.trim(),out=e.target.previousElementSibling;input.value='';if(!cmd)return;const line=document.createElement('pre');line.textContent='nishal:~$ '+cmd;out.append(line);let response;const [verb,...args]=cmd.toLowerCase().split(/\s+/);if(verb==='help')response='Available commands:\n  ls                  List folders\n  open <folder>       Open a folder\n  about               About Nishal\n  projects            Browse projects\n  whoami              Who lives here?\n  date                Current date\n  clear               Clear terminal\n\nFolders: about, education, experience, projects, contact';else if(verb==='ls')response='about/   education/   experience/\nprojects/   contact/';else if(verb==='whoami')response='Nishal Chintalapati\nSoftware engineer · UCLA · San Ramon, CA';else if(verb==='date')response=new Date().toLocaleString();else if(verb==='clear'){out.replaceChildren();return}else if(verb==='open'||views[verb]){const id=verb==='open'?args.join(' '):verb;const aliases={'about me':'about','ironman intel':'ironman','fraud lab':'fraud'};const target=aliases[id]||id;if(views[target]){openWindow(target);response='Opened '+views[target].title}else response='Folder not found. Type ls to see available folders.'}else response='Command not found. Type help for available commands.';const result=document.createElement('pre');result.textContent=response;out.append(result);e.target.scrollIntoView({block:'nearest'})}
document.addEventListener('click',e=>{const opener=e.target.closest('[data-open]');if(opener){openWindow(opener.dataset.open);$('#system-menu').hidden=true;$('#system-toggle').setAttribute('aria-expanded','false')}const action=e.target.closest('[data-action]');if(action){const w=action.closest('.window'),id=w.dataset.window;if(action.dataset.action==='close')closeWindow(id);else if(action.dataset.action==='minimize'){w.hidden=true;activeId=null;renderTasks()}else{w.classList.toggle('maximized');action.setAttribute('aria-label',(w.classList.contains('maximized')?'Restore ':'Maximize ')+views[id].title)}}const task=e.target.closest('[data-task]');if(task)focusWindow(task.dataset.task);const stage=e.target.closest('[data-stage]');if(stage){const w=stage.closest('.window');w.querySelector('#stage-copy').textContent=stages[Number(stage.dataset.stage)];w.querySelectorAll('[data-stage]').forEach(b=>{b.classList.toggle('selected',b===stage);b.setAttribute('aria-pressed',String(b===stage))})}if(!e.target.closest('#system-menu,#system-toggle')){$('#system-menu').hidden=true;$('#system-toggle').setAttribute('aria-expanded','false')}});
$('#system-toggle').onclick=()=>{const m=$('#system-menu');m.hidden=!m.hidden;$('#system-toggle').setAttribute('aria-expanded',String(!m.hidden))};
$('#home').onclick=()=>openWindow('home');$('#help').onclick=()=>openWindow('home');
function arrange(){let i=0;openWindows.forEach(w=>{w.classList.remove('maximized');w.style.left=(innerWidth>700?145+(i%4)*16:80)+'px';w.style.top=(innerWidth>700?25+(i%4)*16:16)+'px';w.style.width='';w.style.height='';i++})}
$('#arrange').onclick=()=>{arrange();$('#system-menu').hidden=true};
function toggleFocus(){if(document.body.classList.contains('zoomed'))leaveComputer();else enterComputer3D()}
$('#focus-mode').onclick=toggleFocus;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeId)closeWindow(activeId)});
function tick(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,10000);window.addEventListener('resize',arrange);openWindow('home');

$("#menu-focus").onclick=()=>{toggleFocus();$("#system-menu").hidden=true};

// Keep the desktop on the monitor throughout the camera move.
const rig=$('.camera-rig');
let moving=false;
const enterButton=document.createElement('button');enterButton.className='enter-computer';enterButton.innerHTML='<span>CLICK TO ENTER</span>';enterButton.setAttribute('aria-label','Zoom into the 3D computer');document.body.append(enterButton);
function overviewTransform(){const fit=Math.min(innerWidth/1150,innerHeight/930,1);return 'translate(-50%,-50%) translateY(-45px) translateZ(-700px) rotateX(-9deg) rotateY(-22deg) scale('+fit+')'}
function closeupTransform(){
 const scale=Math.min(innerWidth*.94/900,innerHeight*.90/620);
 const z=1500*(1-1/scale)-170;
 return 'translate(-50%,-50%) translateY(0px) translateZ('+z+'px) rotateX(0deg) rotateY(0deg) scale(1)';
}
function setOverview(){if(!moving)rig.style.transform=document.body.classList.contains('zoomed')?closeupTransform():overviewTransform()}
async function moveCamera(enter){
 if(moving)return;moving=true;enterButton.hidden=true;
 document.body.classList.add('camera-moving');
 const start=enter?overviewTransform():closeupTransform(),end=enter?closeupTransform():overviewTransform();
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const animation=rig.animate([{transform:start},{transform:end}],{duration:reduced?0:2800,easing:'cubic-bezier(.42,0,.16,1)',fill:'forwards'});
 await animation.finished;
 rig.style.transform=end;animation.cancel();
 document.body.classList.toggle('zoomed',enter);document.body.classList.remove('camera-moving');
 moving=false;enterButton.hidden=enter;
 $('#menu-focus').textContent=enter?'Back to desk':'Enter computer';
}
function enterComputer3D(){if(!document.body.classList.contains('zoomed'))return moveCamera(true)}
function leaveComputer(){return moveCamera(false)}
enterButton.onclick=enterComputer3D;$('#focus-mode').onclick=toggleFocus;$('#view-toggle').onclick=toggleFocus;
window.addEventListener('resize',setOverview);setOverview();
// Route wheel and trackpad input to the window under the pointer in the 3D screen.
document.addEventListener('wheel',event=>{
 if(event.ctrlKey||moving)return;
 const hovered=event.target.closest('.window');
 const target=hovered||((event.target.closest('#screen')&&activeId)?openWindows.get(activeId):null);
 if(!target||target.hidden)return;
 const content=target.querySelector('.window-body');
 if(!content||content.scrollHeight<=content.clientHeight+1)return;
 let delta=event.deltaY;
 if(event.deltaMode===1)delta*=18;
 if(event.deltaMode===2)delta*=content.clientHeight;
 content.scrollTop+=delta;
 event.preventDefault();
},{passive:false,capture:true});
</script></body></html>
